[graph]
exclude-unpublished = true

[advisories]
unmaintained = "none"
ignore = ["RUSTSEC-2026-0285", "RUSTSEC-2026-0221"]

[licenses]
confidence-threshold = 0.8
allow = [
    "BSD-2-Clause",
    "Apache-2.0",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
    "ISC",
    "CDLA-Permissive-2.0"
]

[bans]
multiple-versions = "deny"
highlight = "all"
skip-tree = [
    # TODO: @geofmureithi Understand why lapin is pulling in different versions
    { name = "nom" },
    { name = "r-efi" },
    { name = "getrandom" },
    { name = "cpufeatures" },
    { name = "syn" }
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-git = []
